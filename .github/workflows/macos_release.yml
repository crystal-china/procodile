on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Download source
        uses: actions/checkout@v7

      - name: Cache shards
        uses: actions/cache@v6
        with:
          path: ~/.cache/shards
          key: ${{ runner.os }}-shards-${{ hashFiles('shard.yml', 'shard.lock') }}
          restore-keys: ${{ runner.os }}-shards-

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1

      - name: Check formatting
        run: crystal tool format --check

      - name: Install shards
        run: shards check || shards install --without-development

      # - name: Run tests
      #   run: crystal spec --order=random --error-on-warnings

      - name: Collect package information
        run: |
          echo "BINARY_NAME=bin/$(cat shard.yml |grep targets -A1|tail -n1 |sed 's#[ :]##g')" >> $GITHUB_ENV
          echo "PKG_ARCH=$(uname -m)" >> $GITHUB_ENV
          echo "PLATFORM=apple-darwin.tar.gz" >> $GITHUB_ENV
          echo "BUILD_ARGS=" >> $GITHUB_ENV

      - name: Set asset name
        run: |
          asset_basename=$(basename "${{env.BINARY_NAME}}")
          echo "ASSET_NAME=${asset_basename}-${{github.ref_name}}-${{env.PKG_ARCH}}-${{env.PLATFORM}}" >> $GITHUB_ENV

      - name: Build release binary
        id: release
        run: |
          echo "ASSET_NAME=${{env.ASSET_NAME}}" >> $GITHUB_OUTPUT
          shards build --production --progress --no-debug -Dstrict_multi_assign -Dno_number_autocast ${{env.BUILD_ARGS}}
          tar zcvf ${{env.ASSET_NAME}} ${{env.BINARY_NAME}} LICENSE

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{steps.release.outputs.ASSET_NAME}}
